services:
  - type: web
    name: telegram-personal-auto-poster
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: telegram-auto-poster-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: BOT_OWNER_ID
        sync: false
